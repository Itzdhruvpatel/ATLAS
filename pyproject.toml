[project]
name = "atlas-firewall"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["httpx>=0.27", "pydantic>=2.7", "pyyaml>=6", "sqlglot>=25", "fastapi>=0.110", "uvicorn>=0.30"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
include = ["atlas*", "arena*", "eval*", "gateway*", "redteam*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
